name: Generate Template Preview Images

# Regenerate docs/previews/*.png whenever the expected PDFs change
# (e.g. after running regenerate-expected.yml or a template update).
# Also runs on changes to this workflow file, and can be triggered
# manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'tests/expected/**'
      - 'templates/**/metadata.yaml'
      - 'scripts/update-readme.py'
      - '.github/workflows/preview-images.yml'
  workflow_dispatch:

jobs:
  generate-previews:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true          # required: expected PDFs are stored in Git LFS

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y poppler-utils python3-yaml

      - name: Generate PNG previews
        run: |
          mkdir -p docs/previews

          # Discover templates dynamically from metadata.yaml files.
          for yaml_path in templates/*/metadata.yaml; do
            template=$(basename "$(dirname "$yaml_path")")

            # Prefer the *-complex fixture (richest content); fall back to
            # the first available PDF for this template.
            pdf="tests/expected/${template}-complex.pdf"
            if [ ! -f "$pdf" ]; then
              pdf=$(ls tests/expected/${template}-*.pdf 2>/dev/null | sort | head -1)
            fi

            if [ -f "$pdf" ]; then
              echo "Converting: $pdf"
              # Render the first page at 120 DPI (≈ 990 × 1400 px for A4).
              # pdftoppm names its output <prefix>-<N>.png; we copy the
              # single result to a predictable path.
              pdftoppm -r 120 -png -f 1 -l 1 "$pdf" "/tmp/${template}_preview"
              out=$(ls /tmp/${template}_preview*.png 2>/dev/null | head -1)
              if [ -n "$out" ]; then
                cp "$out" "docs/previews/${template}.png"
                echo "  -> docs/previews/${template}.png"
              else
                echo "::warning::pdftoppm produced no output for template '$template'"
              fi
            else
              echo "::warning::No PDF found for template '$template', skipping."
            fi
          done

      - name: Update README auto-generated sections
        run: python3 scripts/update-readme.py

      - name: Commit and push updated preview images and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/previews/ README.org
          if git diff --staged --quiet; then
            echo "Everything is already up to date — nothing to commit."
          else
            git commit -m "docs: regenerate template preview images and README"
            git push
          fi
